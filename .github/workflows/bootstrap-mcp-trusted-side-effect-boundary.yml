name: Bootstrap MCP Trusted Side-Effect Boundary

on:
  push:
    branches:
      - fix/mcp-trusted-side-effect-boundary

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/mcp-trusted-side-effect-boundary
          fetch-depth: 0

      - name: Run capability hardening script from one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/apply-mcp-trusted-side-effect-boundary.yml")
          text = path.read_text()
          start_marker = "      - name: Apply capability hardening\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Remove one-shot workflow from resulting commit\n"
          assert text.count(start_marker) == 1, "apply-step start marker changed"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          yaml_indent = "          "
          triple = None
          output = []
          for raw in block.splitlines():
              candidate = raw[len(yaml_indent):] if raw.startswith(yaml_indent) else raw
              if triple is None:
                  line = candidate
                  positions = [
                      (line.find(marker), marker)
                      for marker in ("'''", '\"\"\"')
                      if line.find(marker) >= 0 and line.count(marker) % 2 == 1
                  ]
                  if positions:
                      _, triple = min(positions)
              else:
                  if triple in raw and raw.count(triple) % 2 == 1:
                      line = candidate
                      triple = None
                  else:
                      line = raw
              output.append(line)
          assert triple is None, "unterminated triple-quoted literal in extracted script"
          script = "\n".join(output) + "\n"
          assert script.startswith("python - <<'PY'\n"), repr(script[:80])
          helper_old = '    count = text.count(old)\n    assert count == 1, f"{label}: expected exactly one match, got {count}"\n    return text.replace(old, new, 1)\n'
          helper_new = '    count = text.count(old)\n    if label == "get_tool_definitions signature":\n        assert count >= 1, f"{label}: expected at least one match, got {count}"\n    else:\n        assert count == 1, f"{label}: expected exactly one match, got {count}"\n    return text.replace(old, new, 1)\n'
          assert script.count(helper_old) == 1, "replace_once helper changed"
          script = script.replace(helper_old, helper_new, 1)
          Path("/tmp/apply-capability-hardening.sh").write_text(script)
          PY
          bash /tmp/apply-capability-hardening.sh

      - name: Refine trusted compatibility and plugin state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("agent/transports/hermes_tools_mcp_server.py")
          text = path.read_text()

          anchor_old = (
              "    # Always request the raw pre-Tool-Search catalog. Otherwise progressive\n"
              "    # disclosure can replace real tools with tool_search/tool_describe/tool_call\n"
              "    # before this MCP adapter gets a chance to expose them.\n"
              "    all_defs = {\n"
          )
          anchor_new = (
              "    # Always request the raw pre-Tool-Search catalog. Otherwise progressive\n"
              "    # disclosure can replace real tools with tool_search/tool_describe/tool_call\n"
              "    # before this MCP adapter gets a chance to expose them.\n"
              "    definition_kwargs = {\n"
              "        \"quiet_mode\": True,\n"
              "        \"skip_tool_search_assembly\": True,\n"
              "    }\n"
              "    if not allow_native_execution:\n"
              "        definition_kwargs[\"excluded_capabilities\"] = set(_MCP_UNSAFE_CAPABILITIES)\n"
              "\n"
              "    all_defs = {\n"
          )
          assert text.count(anchor_old) == 1, "MCP catalog anchor changed"
          text = text.replace(anchor_old, anchor_new, 1)

          call_old = (
              "            get_tool_definitions(\n"
              "                quiet_mode=True,\n"
              "                skip_tool_search_assembly=True,\n"
              "                excluded_capabilities=(\n"
              "                    None if allow_native_execution else set(_MCP_UNSAFE_CAPABILITIES)\n"
              "                ),\n"
              "            )\n"
          )
          call_new = "            get_tool_definitions(**definition_kwargs)\n"
          assert text.count(call_old) == 1, "MCP definition call shape changed"
          text = text.replace(call_old, call_new, 1)

          plugin_old = (
              "    if not allow_native_execution:\n"
              "        os.environ[\"HERMES_SKIP_PLUGIN_DISCOVERY\"] = \"1\"\n"
              "\n"
              "    from model_tools import get_tool_definitions, handle_function_call\n"
          )
          plugin_new = (
              "    if not allow_native_execution:\n"
              "        os.environ[\"HERMES_SKIP_PLUGIN_DISCOVERY\"] = \"1\"\n"
              "    else:\n"
              "        os.environ.pop(\"HERMES_SKIP_PLUGIN_DISCOVERY\", None)\n"
              "\n"
              "    from model_tools import get_tool_definitions, handle_function_call\n"
              "\n"
              "    if allow_native_execution:\n"
              "        try:\n"
              "            from hermes_cli.plugins import discover_plugins\n"
              "\n"
              "            discover_plugins()\n"
              "        except Exception as exc:\n"
              "            logger.debug(\"Trusted MCP plugin discovery failed: %s\", exc)\n"
          )
          assert text.count(plugin_old) == 1, "plugin-discovery policy block changed"
          path.write_text(text.replace(plugin_old, plugin_new, 1))

          test_path = Path("tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py")
          test_text = test_path.read_text()
          test_text += (
              "\n\n"
              "def test_trusted_policy_clears_safe_plugin_discovery_suppression():\n"
              "    source = Path(\"agent/transports/hermes_tools_mcp_server.py\").read_text()\n"
              "    assert 'os.environ.pop(\"HERMES_SKIP_PLUGIN_DISCOVERY\", None)' in source\n"
              "    assert \"if allow_native_execution:\\n        try:\\n            from hermes_cli.plugins import discover_plugins\" in source\n"
          )
          if "from pathlib import Path\n" not in test_text:
              future = "from __future__ import annotations\n"
              assert test_text.startswith(future), "unexpected test module preamble"
              test_text = test_text.replace(future, future + "\nfrom pathlib import Path\n", 1)
          test_path.write_text(test_text)
          PY

      - name: Remove bootstrap workflows from resulting diff
        run: |
          rm .github/workflows/apply-mcp-trusted-side-effect-boundary.yml
          rm .github/workflows/bootstrap-mcp-trusted-side-effect-boundary.yml

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Targeted trust-boundary tests
        run: |
          uv run pytest -q \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py \
            tests/agent/transports/test_hermes_tools_mcp_context.py \
            tests/tools/test_mcp_tool.py

      - name: Ruff changed files
        run: |
          uv run ruff check \
            agent/transports/hermes_tools_mcp_server.py \
            model_tools.py \
            tools/registry.py \
            tools/skill_manager_tool.py \
            tools/homeassistant_tool.py \
            tools/discord_tool.py \
            tools/feishu_drive_tool.py \
            tools/yuanbao_tools.py \
            tools/kanban_tools.py \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py

      - name: Commit validated hardening and clean workflow diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/apply-mcp-trusted-side-effect-boundary.yml \
            .github/workflows/bootstrap-mcp-trusted-side-effect-boundary.yml \
            agent/transports/hermes_tools_mcp_server.py \
            model_tools.py \
            tools/registry.py \
            tools/skill_manager_tool.py \
            tools/homeassistant_tool.py \
            tools/discord_tool.py \
            tools/feishu_drive_tool.py \
            tools/yuanbao_tools.py \
            tools/kanban_tools.py \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py
          git diff --cached --check
          git commit -m "fix(mcp): gate trusted side-effect capabilities"
          git push origin HEAD:fix/mcp-trusted-side-effect-boundary
