name: Bootstrap MCP Trusted Side-Effect Boundary

on:
  push:
    branches:
      - fix/mcp-trusted-side-effect-boundary

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/mcp-trusted-side-effect-boundary
          fetch-depth: 0

      - name: Run capability hardening script from one-shot workflow
        shell: bash
        run: |
          ruby - <<'RUBY'
          require "yaml"
          path = ".github/workflows/apply-mcp-trusted-side-effect-boundary.yml"
          doc = YAML.load_file(path)
          steps = doc.fetch("jobs").fetch("apply-and-test").fetch("steps")
          step = steps.find { |s| s["name"] == "Apply capability hardening" }
          raise "Apply capability hardening step not found" unless step && step["run"]
          File.write("/tmp/apply-capability-hardening.sh", step["run"])
          RUBY
          bash /tmp/apply-capability-hardening.sh

      - name: Remove bootstrap workflows from resulting diff
        run: |
          rm .github/workflows/apply-mcp-trusted-side-effect-boundary.yml
          rm .github/workflows/bootstrap-mcp-trusted-side-effect-boundary.yml

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Targeted trust-boundary tests
        run: |
          uv run pytest -q \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py \
            tests/agent/transports/test_hermes_tools_mcp_context.py \
            tests/tools/test_mcp_tool.py

      - name: Ruff changed files
        run: |
          uv run ruff check \
            agent/transports/hermes_tools_mcp_server.py \
            model_tools.py \
            tools/registry.py \
            tools/skill_manager_tool.py \
            tools/homeassistant_tool.py \
            tools/discord_tool.py \
            tools/feishu_drive_tool.py \
            tools/yuanbao_tools.py \
            tools/kanban_tools.py \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py

      - name: Commit validated hardening and clean workflow diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/apply-mcp-trusted-side-effect-boundary.yml \
            .github/workflows/bootstrap-mcp-trusted-side-effect-boundary.yml \
            agent/transports/hermes_tools_mcp_server.py \
            model_tools.py \
            tools/registry.py \
            tools/skill_manager_tool.py \
            tools/homeassistant_tool.py \
            tools/discord_tool.py \
            tools/feishu_drive_tool.py \
            tools/yuanbao_tools.py \
            tools/kanban_tools.py \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py
          git diff --cached --check
          git commit -m "fix(mcp): gate trusted side-effect capabilities"
          git push origin HEAD:fix/mcp-trusted-side-effect-boundary
