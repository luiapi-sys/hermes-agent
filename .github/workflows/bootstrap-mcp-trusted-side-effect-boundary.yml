name: Bootstrap MCP Trusted Side-Effect Boundary

on:
  push:
    branches:
      - fix/mcp-trusted-side-effect-boundary

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/mcp-trusted-side-effect-boundary
          fetch-depth: 0

      - name: Run capability hardening script from one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/apply-mcp-trusted-side-effect-boundary.yml")
          text = path.read_text()
          start_marker = "      - name: Apply capability hardening\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Remove one-shot workflow from resulting commit\n"
          assert text.count(start_marker) == 1, "apply-step start marker changed"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          yaml_indent = "          "
          lines = block.splitlines()
          script = "\n".join(
              line[len(yaml_indent):] if line.startswith(yaml_indent) else line
              for line in lines
          ) + "\n"
          assert script.startswith("python - <<'PY'\n"), repr(script[:80])
          Path("/tmp/apply-capability-hardening.sh").write_text(script)
          PY
          bash /tmp/apply-capability-hardening.sh

      - name: Close safe-to-trusted plugin-discovery state leak
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("agent/transports/hermes_tools_mcp_server.py")
          text = path.read_text()
          old = '''    if not allow_native_execution:
              os.environ["HERMES_SKIP_PLUGIN_DISCOVERY"] = "1"

          from model_tools import get_tool_definitions, handle_function_call
          '''
          new = '''    if not allow_native_execution:
              os.environ["HERMES_SKIP_PLUGIN_DISCOVERY"] = "1"
          else:
              os.environ.pop("HERMES_SKIP_PLUGIN_DISCOVERY", None)

          from model_tools import get_tool_definitions, handle_function_call

          # model_tools may already be cached from a prior safe build in the same
          # process. Re-run idempotent plugin discovery after trust is enabled so
          # safe -> trusted transitions restore the explicitly trusted surface.
          if allow_native_execution:
              try:
                  from hermes_cli.plugins import discover_plugins

                  discover_plugins()
              except Exception as exc:
                  logger.debug("Trusted MCP plugin discovery failed: %s", exc)
          '''
          assert text.count(old) == 1, "plugin-discovery policy block changed"
          path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py")
          test_text = test_path.read_text()
          test_text += '''\n\ndef test_trusted_policy_clears_safe_plugin_discovery_suppression():\n    source = Path(\"agent/transports/hermes_tools_mcp_server.py\").read_text()\n    assert 'os.environ.pop(\"HERMES_SKIP_PLUGIN_DISCOVERY\", None)' in source\n    assert \"if allow_native_execution:\\n        try:\\n            from hermes_cli.plugins import discover_plugins\" in source\n'''
          if "from pathlib import Path\n" not in test_text:
              test_text = "from pathlib import Path\n" + test_text
          test_path.write_text(test_text)
          PY

      - name: Remove bootstrap workflows from resulting diff
        run: |
          rm .github/workflows/apply-mcp-trusted-side-effect-boundary.yml
          rm .github/workflows/bootstrap-mcp-trusted-side-effect-boundary.yml

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Targeted trust-boundary tests
        run: |
          uv run pytest -q \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py \
            tests/agent/transports/test_hermes_tools_mcp_context.py \
            tests/tools/test_mcp_tool.py

      - name: Ruff changed files
        run: |
          uv run ruff check \
            agent/transports/hermes_tools_mcp_server.py \
            model_tools.py \
            tools/registry.py \
            tools/skill_manager_tool.py \
            tools/homeassistant_tool.py \
            tools/discord_tool.py \
            tools/feishu_drive_tool.py \
            tools/yuanbao_tools.py \
            tools/kanban_tools.py \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py

      - name: Commit validated hardening and clean workflow diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/apply-mcp-trusted-side-effect-boundary.yml \
            .github/workflows/bootstrap-mcp-trusted-side-effect-boundary.yml \
            agent/transports/hermes_tools_mcp_server.py \
            model_tools.py \
            tools/registry.py \
            tools/skill_manager_tool.py \
            tools/homeassistant_tool.py \
            tools/discord_tool.py \
            tools/feishu_drive_tool.py \
            tools/yuanbao_tools.py \
            tools/kanban_tools.py \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py
          git diff --cached --check
          git commit -m "fix(mcp): gate trusted side-effect capabilities"
          git push origin HEAD:fix/mcp-trusted-side-effect-boundary
