name: Diagnose MCP final hardening

on:
  pull_request:
    branches:
      - fix/mcp-full-policy-hardening

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find latest one-shot hardening run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --branch fix/mcp-final-unclassified-surface \
            --limit 30 \
            --json databaseId,name,event,headSha,status,conclusion,url)"
          echo "$runs" | jq .
          run_id="$(echo "$runs" | jq -r \
            '[.[] | select(.name == "Apply MCP final security hardening")][0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "ONE_SHOT_RUN_NOT_FOUND" >&2
            exit 2
          fi
          echo "ONE_SHOT_RUN_ID=$run_id"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url
          if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
            echo "--- failed logs ---"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
            exit 1
          fi
          echo "ONE_SHOT_HARDENING_OK run=$run_id"
