name: OpenRouter Test Isolation Fix

on:
  push:
    branches:
      - fix/openrouter-test-isolation

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/openrouter-test-isolation

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Pin remote catalog in live OpenRouter unit tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/hermes_cli/test_models.py")
          text = path.read_text(encoding="utf-8")
          old = '''        with patch("hermes_cli.models._urlopen_model_catalog_request", return_value=_Resp()):
                      models = fetch_openrouter_models(force_refresh=True)
          '''
          new = '''        with (
                      patch("hermes_cli.model_catalog.get_curated_openrouter_models", return_value=[]),
                      patch("hermes_cli.models._urlopen_model_catalog_request", return_value=_Resp()),
                  ):
                      models = fetch_openrouter_models(force_refresh=True)
          '''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected exactly 2 unpinned live-fetch blocks, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Run OpenRouter model tests
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          source .venv/bin/activate
          python -m pytest -q tests/hermes_cli/test_models.py

      - name: Commit deterministic test isolation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/hermes_cli/test_models.py
          git diff --cached --check
          git commit -m "test: isolate OpenRouter live catalog fixtures"
          git push origin HEAD:fix/openrouter-test-isolation
