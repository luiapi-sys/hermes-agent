name: MCP Final Boundary Smoke

on:
  pull_request:
    branches:
      - fix/mcp-full-policy-hardening

permissions:
  contents: read

jobs:
  final-boundary-smoke:
    runs-on: ubuntu-24.04
    env:
      HERMES_INTERACTIVE: "1"
      HERMES_KANBAN_TASK: mcp-final-smoke
    steps:
      - name: Checkout validation snapshot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: test/mcp-policy-smoke-final

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run MCP policy and client tests
        run: |
          uv run pytest -q \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py \
            tests/agent/transports/test_hermes_tools_mcp_context.py \
            tests/tools/test_mcp_tool.py

      - name: Ruff capability boundary files
        run: |
          uv run ruff check \
            agent/transports/hermes_tools_mcp_server.py \
            agent/transports/hermes_tools_mcp_context.py \
            tools/registry.py \
            tools/mcp_tool.py \
            tools/kanban_tools.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py

      - name: Real stdio safe and trusted boundary smoke
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_HOME="$RUNNER_TEMP/hermes-final-smoke"
          export HERMES_MCP_SESSION_ID="mcp-final-smoke"
          export HERMES_YOLO_MODE=1
          export HERMES_ACCEPT_HOOKS=1
          export OPENROUTER_API_KEY=""
          export OPENAI_API_KEY=""
          export NOUS_API_KEY=""
          unset HERMES_MCP_MODE || true
          unset HERMES_MCP_DISCOVER_EXTERNAL || true
          unset HERMES_MCP_ALLOW_NATIVE_EXECUTION || true
          mkdir -p "$HERMES_HOME"

          MARKER="$RUNNER_TEMP/external-mcp-started"
          rm -f "$MARKER"

          cat > "$RUNNER_TEMP/ext_mcp.py" <<PY
          from pathlib import Path
          from mcp.server.fastmcp import FastMCP

          Path(r"$MARKER").write_text("started")
          mcp = FastMCP("final-boundary-external")

          @mcp.tool()
          def ext_echo(text: str) -> str:
              return f"EXT:{text}"

          if __name__ == "__main__":
              mcp.run()
          PY

          write_config() {
            local native="$1"
            cat > "$HERMES_HOME/config.yaml" <<YAML
          mcp:
            hermes_tools:
              mode: full
              discover_external: true
              allow_native_execution: ${native}
          mcp_servers:
            smoke_external:
              command: "${GITHUB_WORKSPACE}/.venv/bin/python"
              args:
                - "${RUNNER_TEMP}/ext_mcp.py"
              connect_timeout: 15
              timeout: 30
          YAML
          }

          source .venv/bin/activate

          write_config false
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          FORBIDDEN = {
              "terminal", "process", "read_file", "write_file", "patch",
              "search_files", "execute_code", "delegate_task", "cronjob",
              "kanban_create", "kanban_unblock", "kanban_complete",
          }

          async def main():
              params = StdioServerParameters(
                  command=str(Path.cwd() / ".venv" / "bin" / "python"),
                  args=["-m", "agent.transports.hermes_tools_mcp_server", "--verbose"],
                  env=dict(os.environ),
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      names = {tool.name for tool in (await session.list_tools()).tools}
                      leaked = sorted(names & FORBIDDEN)
                      assert not leaked, f"unsafe capabilities leaked into safe-full: {leaked}"
                      external = sorted(n for n in names if n.startswith("mcp__smoke_external__"))
                      assert not external, f"external MCP leaked into safe-full: {external}"
                      for required in ("memory", "session_search", "todo"):
                          assert required in names, f"missing safe tool: {required}"
                      print(f"SAFE_FULL count={len(names)}")
                      print("MCP_FINAL_SAFE_OK")

          asyncio.run(main())
          PY

          if [[ -e "$MARKER" ]]; then
            echo "external MCP stdio process launched under safe-full" >&2
            exit 1
          fi
          echo "MCP_FINAL_SAFE_NO_EXTERNAL_SPAWN_OK"

          write_config true
          python - <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          def result_text(result):
              return "\n".join(getattr(item, "text", "") for item in result.content)

          async def main():
              params = StdioServerParameters(
                  command=str(Path.cwd() / ".venv" / "bin" / "python"),
                  args=["-m", "agent.transports.hermes_tools_mcp_server", "--verbose"],
                  env=dict(os.environ),
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = {tool.name: tool for tool in (await session.list_tools()).tools}
                      for required in (
                          "terminal", "process", "read_file", "write_file", "patch",
                          "execute_code", "memory", "session_search", "todo",
                          "delegate_task", "cronjob", "kanban_create", "kanban_complete",
                      ):
                          assert required in tools, f"missing trusted tool: {required}"

                      external = next(
                          (name for name in tools if name.endswith("__ext_echo")),
                          None,
                      )
                      assert external, "trusted-full did not expose external MCP tool"

                      schema = getattr(tools["terminal"], "inputSchema", None) or {}
                      props = schema.get("properties") or {}
                      if "command" in props:
                          terminal_args = {"command": "printf mcp-final-terminal"}
                      elif "commands" in props:
                          spec = props["commands"] or {}
                          terminal_args = {
                              "commands": ["printf mcp-final-terminal"]
                              if spec.get("type") == "array"
                              else "printf mcp-final-terminal"
                          }
                      else:
                          raise AssertionError(
                              f"unexpected terminal schema: {json.dumps(schema)}"
                          )

                      terminal = await session.call_tool("terminal", terminal_args)
                      assert "mcp-final-terminal" in result_text(terminal)

                      ext = await session.call_tool(external, {"text": "trusted"})
                      assert "EXT:trusted" in result_text(ext)
                      print(f"TRUSTED_FULL count={len(tools)}")
                      print("MCP_FINAL_TRUSTED_OK")

          asyncio.run(main())
          PY

          test -e "$MARKER"
          echo "MCP_FINAL_TRUSTED_EXTERNAL_SPAWN_OK"
