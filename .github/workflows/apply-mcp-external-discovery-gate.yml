name: Apply External MCP Discovery Gate

on:
  pull_request:
    branches:
      - fix/mcp-full-policy-hardening

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/mcp-external-discovery-gate
          fetch-depth: 0

      - name: Apply safe external discovery gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server_path = Path("agent/transports/hermes_tools_mcp_server.py")
          text = server_path.read_text()

          old_sig = (
              "def _discover_external_mcp_tools(\n"
              "    mode: str,\n"
              "    *,\n"
              "    enabled: bool | None = None,\n"
              ") -> None:\n"
          )
          new_sig = (
              "def _discover_external_mcp_tools(\n"
              "    mode: str,\n"
              "    *,\n"
              "    enabled: bool | None = None,\n"
              "    allow_native_execution: bool = False,\n"
              ") -> None:\n"
          )
          assert old_sig in text, "external discovery signature changed"
          text = text.replace(old_sig, new_sig, 1)

          old_gate = (
              "    if not enabled:\n"
              "        logger.info(\"external MCP discovery disabled by config\")\n"
              "        return\n"
              "\n"
              "    try:\n"
          )
          new_gate = (
              "    if not enabled:\n"
              "        logger.info(\"external MCP discovery disabled by config\")\n"
              "        return\n"
              "    if not allow_native_execution:\n"
              "        logger.info(\n"
              "            \"external MCP discovery suppressed because \"\n"
              "            \"allow_native_execution is false\"\n"
              "        )\n"
              "        return\n"
              "\n"
              "    try:\n"
          )
          assert old_gate in text, "external discovery enabled gate changed"
          text = text.replace(old_gate, new_gate, 1)

          old_call = "    _discover_external_mcp_tools(mode, enabled=discover_external)\n"
          new_call = (
              "    _discover_external_mcp_tools(\n"
              "        mode,\n"
              "        enabled=discover_external,\n"
              "        allow_native_execution=allow_native_execution,\n"
              "    )\n"
          )
          assert old_call in text, "external discovery build call changed"
          text = text.replace(old_call, new_call, 1)
          server_path.write_text(text)

          test_path = Path("tests/agent/transports/test_hermes_tools_mcp_server.py")
          tests = test_path.read_text()

          old_discover = (
              "        _discover_external_mcp_tools(MCP_MODE_FULL)\n"
              "        assert calls == [\"discover\"]\n"
          )
          new_discover = (
              "        _discover_external_mcp_tools(\n"
              "            MCP_MODE_FULL,\n"
              "            allow_native_execution=True,\n"
              "        )\n"
              "        assert calls == [\"discover\"]\n"
          )
          assert old_discover in tests, "full discovery test changed"
          tests = tests.replace(old_discover, new_discover, 1)

          old_disable = (
              "        _discover_external_mcp_tools(MCP_MODE_FULL)\n"
              "        assert calls == []\n"
          )
          new_disable = (
              "        _discover_external_mcp_tools(\n"
              "            MCP_MODE_FULL,\n"
              "            allow_native_execution=True,\n"
              "        )\n"
              "        assert calls == []\n"
          )
          assert old_disable in tests, "disabled discovery test changed"
          tests = tests.replace(old_disable, new_disable, 1)

          anchor = "    def test_full_mode_can_disable_external_discovery(self, monkeypatch):\n"
          new_test = (
              "    def test_full_mode_safe_policy_does_not_launch_external_mcp(self, monkeypatch):\n"
              "        import hermes_cli.mcp_startup as startup\n"
              "\n"
              "        calls = []\n"
              "        monkeypatch.setattr(\n"
              "            startup,\n"
              "            \"_discover_mcp_tools_without_interactive_oauth\",\n"
              "            lambda: calls.append(\"discover\"),\n"
              "        )\n"
              "        monkeypatch.setenv(MCP_DISCOVER_EXTERNAL_ENV, \"1\")\n"
              "\n"
              "        _discover_external_mcp_tools(MCP_MODE_FULL)\n"
              "        assert calls == []\n"
              "\n"
          )
          assert anchor in tests, "external discovery test anchor changed"
          tests = tests.replace(anchor, new_test + anchor, 1)
          test_path.write_text(tests)
          PY

      - name: Remove one-shot workflow from resulting commit
        run: rm .github/workflows/apply-mcp-external-discovery-gate.yml

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Targeted MCP tests
        run: |
          uv run pytest -q \
            tests/agent/transports/test_hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py \
            tests/agent/transports/test_hermes_tools_mcp_context.py \
            tests/tools/test_mcp_tool.py

      - name: Ruff changed files
        run: |
          uv run ruff check \
            agent/transports/hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py

      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/transports/hermes_tools_mcp_server.py tests/agent/transports/test_hermes_tools_mcp_server.py
          git commit -m "fix(mcp): gate external discovery on native execution"
          git push origin HEAD:fix/mcp-external-discovery-gate
