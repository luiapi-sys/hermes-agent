name: Apply External MCP Discovery Gate

on:
  pull_request:
    branches:
      - fix/mcp-full-policy-hardening

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/mcp-external-discovery-gate
          fetch-depth: 0

      - name: Apply safe external discovery gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server_path = Path("agent/transports/hermes_tools_mcp_server.py")
          text = server_path.read_text()

          old_sig = '''def _discover_external_mcp_tools(
              mode: str,
              *,
              enabled: bool | None = None,
          ) -> None:
          '''
          new_sig = '''def _discover_external_mcp_tools(
              mode: str,
              *,
              enabled: bool | None = None,
              allow_native_execution: bool = False,
          ) -> None:
          '''
          assert old_sig in text, "external discovery signature changed"
          text = text.replace(old_sig, new_sig, 1)

          old_gate = '''    if not enabled:
              logger.info("external MCP discovery disabled by config")
              return

              try:
          '''
          new_gate = '''    if not enabled:
              logger.info("external MCP discovery disabled by config")
              return
              if not allow_native_execution:
              logger.info(
                  "external MCP discovery suppressed because "
                  "allow_native_execution is false"
              )
              return

              try:
          '''
          # Preserve exact indentation by building the replacement without the
          # YAML block's visual indentation.
          old_gate = old_gate.replace("          ", "")
          new_gate = new_gate.replace("          ", "")
          assert old_gate in text, "external discovery enabled gate changed"
          text = text.replace(old_gate, new_gate, 1)

          old_call = '''    _discover_external_mcp_tools(mode, enabled=discover_external)
          '''.replace("          ", "")
          new_call = '''    _discover_external_mcp_tools(
              mode,
              enabled=discover_external,
              allow_native_execution=allow_native_execution,
          )
          '''.replace("          ", "")
          assert old_call in text, "external discovery build call changed"
          text = text.replace(old_call, new_call, 1)
          server_path.write_text(text)

          test_path = Path("tests/agent/transports/test_hermes_tools_mcp_server.py")
          tests = test_path.read_text()

          old_discover = '''        _discover_external_mcp_tools(MCP_MODE_FULL)
                  assert calls == ["discover"]
          '''
          new_discover = '''        _discover_external_mcp_tools(
                      MCP_MODE_FULL,
                      allow_native_execution=True,
                  )
                  assert calls == ["discover"]
          '''
          old_discover = old_discover.replace("          ", "")
          new_discover = new_discover.replace("          ", "")
          assert old_discover in tests, "full discovery test changed"
          tests = tests.replace(old_discover, new_discover, 1)

          old_disable = '''        _discover_external_mcp_tools(MCP_MODE_FULL)
                  assert calls == []
          '''
          new_disable = '''        _discover_external_mcp_tools(
                      MCP_MODE_FULL,
                      allow_native_execution=True,
                  )
                  assert calls == []
          '''
          old_disable = old_disable.replace("          ", "")
          new_disable = new_disable.replace("          ", "")
          assert old_disable in tests, "disabled discovery test changed"
          tests = tests.replace(old_disable, new_disable, 1)

          anchor = '''    def test_full_mode_can_disable_external_discovery(self, monkeypatch):
          '''.replace("          ", "")
          new_test = '''    def test_full_mode_safe_policy_does_not_launch_external_mcp(self, monkeypatch):
                  import hermes_cli.mcp_startup as startup
          
                  calls = []
                  monkeypatch.setattr(
                      startup,
                      "_discover_mcp_tools_without_interactive_oauth",
                      lambda: calls.append("discover"),
                  )
                  monkeypatch.setenv(MCP_DISCOVER_EXTERNAL_ENV, "1")
          
                  _discover_external_mcp_tools(MCP_MODE_FULL)
                  assert calls == []
          
          '''.replace("          ", "")
          assert anchor in tests, "external discovery test anchor changed"
          tests = tests.replace(anchor, new_test + anchor, 1)
          test_path.write_text(tests)
          PY

      - name: Remove one-shot workflow from resulting commit
        run: rm .github/workflows/apply-mcp-external-discovery-gate.yml

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Targeted MCP tests
        run: |
          uv run pytest -q \
            tests/agent/transports/test_hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py \
            tests/agent/transports/test_hermes_tools_mcp_context.py \
            tests/tools/test_mcp_tool.py

      - name: Ruff changed files
        run: |
          uv run ruff check \
            agent/transports/hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py

      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/transports/hermes_tools_mcp_server.py tests/agent/transports/test_hermes_tools_mcp_server.py
          git commit -m "fix(mcp): gate external discovery on native execution"
          git push origin HEAD:fix/mcp-external-discovery-gate
