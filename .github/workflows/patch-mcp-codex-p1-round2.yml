name: Apply MCP Codex P1 Round 2 Hardening

on:
  push:
    branches:
      - fix/mcp-trusted-side-effect-boundary

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/mcp-trusted-side-effect-boundary
          fetch-depth: 0

      - name: Apply Codex P1 hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f"{label}: expected one match, got {count}"
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "hermes_cli/plugins.py",
              "def discover_plugins(force: bool = False) -> None:\n    \"\"\"Discover and load all plugins.\n\n    Default behavior is idempotent. Pass ``force=True`` to rescan plugin\n    manifests and reload state in the current process.\n    \"\"\"\n    get_plugin_manager().discover_and_load(force=force)\n",
              "def discover_plugins(force: bool = False) -> None:\n    \"\"\"Discover and load all plugins.\n\n    Default behavior is idempotent. Pass ``force=True`` to rescan plugin\n    manifests and reload state in the current process.\n    \"\"\"\n    if os.environ.get(\"HERMES_SKIP_PLUGIN_DISCOVERY\"):\n        logger.debug(\"Plugin discovery suppressed by HERMES_SKIP_PLUGIN_DISCOVERY\")\n        return\n    get_plugin_manager().discover_and_load(force=force)\n",
              "public plugin discovery suppression",
          )
          replace_once(
              "hermes_cli/plugins.py",
              "        if self._discovered and not force:\n            return\n        if env_var_enabled(\"HERMES_SAFE_MODE\"):\n",
              "        if os.environ.get(\"HERMES_SKIP_PLUGIN_DISCOVERY\"):\n            logger.info(\"HERMES_SKIP_PLUGIN_DISCOVERY=1 — plugin discovery skipped\")\n            return\n        if self._discovered and not force:\n            return\n        if env_var_enabled(\"HERMES_SAFE_MODE\"):\n",
              "manager plugin discovery suppression",
          )

          replace_once(
              "tools/registry.py",
              "    EXTERNAL_MCP = \"external_mcp\"\n    REMOTE_MUTATION = \"remote_mutation\"\n",
              "    EXTERNAL_MCP = \"external_mcp\"\n    REMOTE_MUTATION = \"remote_mutation\"\n    PLUGIN_CODE = \"plugin_code\"\n",
              "plugin code capability",
          )
          replace_once(
              "tools/registry.py",
              "    \"vision\": frozenset({ToolCapability.FILESYSTEM_ACCESS}),\n    \"video\": frozenset({ToolCapability.FILESYSTEM_ACCESS}),\n    \"image_gen\": frozenset({ToolCapability.FILESYSTEM_ACCESS}),\n",
              "    \"vision\": frozenset({ToolCapability.FILESYSTEM_ACCESS}),\n    \"video_gen\": frozenset(\n        {ToolCapability.FILESYSTEM_ACCESS, ToolCapability.REMOTE_MUTATION}\n    ),\n    \"image_gen\": frozenset({ToolCapability.FILESYSTEM_ACCESS}),\n    \"memory\": frozenset({ToolCapability.FILESYSTEM_ACCESS}),\n    \"session_search\": frozenset({ToolCapability.FILESYSTEM_ACCESS}),\n    \"skills\": frozenset({ToolCapability.FILESYSTEM_ACCESS}),\n    \"project\": frozenset({ToolCapability.FILESYSTEM_ACCESS}),\n",
              "file-backed and video defaults",
          )
          replace_once(
              "tools/registry.py",
              "        resolved_capabilities = frozenset(\n            _TOOLSET_DEFAULT_CAPABILITIES.get(toolset, frozenset())\n        ).union(capabilities or ())\n        with self._lock:\n",
              "        resolved_capabilities = frozenset(\n            _TOOLSET_DEFAULT_CAPABILITIES.get(toolset, frozenset())\n        ).union(capabilities or ())\n        caller_mod = self._caller_module()\n        if (\n            self._plugin_owner_of(handler) is not None\n            or caller_mod.startswith(\"hermes_plugins.\")\n        ):\n            resolved_capabilities = resolved_capabilities.union(\n                {ToolCapability.PLUGIN_CODE}\n            )\n        with self._lock:\n",
              "automatic plugin capability",
          )

          replace_once(
              "agent/transports/hermes_tools_mcp_server.py",
              "        ToolCapability.EXTERNAL_MCP,\n        ToolCapability.REMOTE_MUTATION,\n",
              "        ToolCapability.EXTERNAL_MCP,\n        ToolCapability.REMOTE_MUTATION,\n        ToolCapability.PLUGIN_CODE,\n",
              "MCP plugin-code unsafe capability",
          )

          replace_once(
              "tools/web_tools.py",
              "from tools.registry import registry, tool_error\n",
              "from tools.registry import ToolCapability, registry, tool_error\n",
              "web capability import",
          )
          replace_once(
              "tools/web_tools.py",
              "    is_async=True,\n    emoji=\"📄\",\n    max_result_size_chars=100_000,\n)\n",
              "    is_async=True,\n    capabilities={ToolCapability.FILESYSTEM_ACCESS},\n    emoji=\"📄\",\n    max_result_size_chars=100_000,\n)\n",
              "web_extract filesystem capability",
          )

          test_path = Path("tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py")
          text = test_path.read_text()
          old_case = '        "video": {ToolCapability.FILESYSTEM_ACCESS},\n'
          new_cases = (
              '        "video_gen": {\n'
              '            ToolCapability.FILESYSTEM_ACCESS,\n'
              '            ToolCapability.REMOTE_MUTATION,\n'
              '        },\n'
              '        "memory": {ToolCapability.FILESYSTEM_ACCESS},\n'
              '        "session_search": {ToolCapability.FILESYSTEM_ACCESS},\n'
              '        "skills": {ToolCapability.FILESYSTEM_ACCESS},\n'
              '        "project": {ToolCapability.FILESYSTEM_ACCESS},\n'
          )
          assert text.count(old_case) == 1, "video trust-boundary test case changed"
          text = text.replace(old_case, new_cases, 1)
          text += (
              "\n\n"
              "def test_plugin_discovery_backend_honors_suppression(monkeypatch):\n"
              "    import hermes_cli.plugins as plugins\n"
              "\n"
              "    monkeypatch.setenv(\"HERMES_SKIP_PLUGIN_DISCOVERY\", \"1\")\n"
              "\n"
              "    def explode(*args, **kwargs):\n"
              "        raise AssertionError(\n"
              "            \"plugin discovery backend executed while suppressed\"\n"
              "        )\n"
              "\n"
              "    monkeypatch.setattr(plugins, \"get_plugin_manager\", explode)\n"
              "    assert plugins.discover_plugins() is None\n"
              "\n"
              "    manager = plugins.PluginManager()\n"
              "    monkeypatch.setattr(manager, \"_discover_and_load_inner\", explode)\n"
              "    manager.discover_and_load()\n"
              "    assert manager._discovered is False\n"
              "\n\n"
              "def test_plugin_defined_handler_is_automatically_unsafe():\n"
              "    registry = ToolRegistry()\n"
              "    namespace = {\"__name__\": \"hermes_plugins.security_probe\"}\n"
              "    exec(\"def handler(args, **kwargs):\\n    return 'ok'\", namespace)\n"
              "    registry.register(\n"
              "        name=\"plugin_probe\",\n"
              "        toolset=\"custom\",\n"
              "        schema={\n"
              "            \"name\": \"plugin_probe\",\n"
              "            \"description\": \"probe\",\n"
              "            \"parameters\": {\"type\": \"object\", \"properties\": {}},\n"
              "        },\n"
              "        handler=namespace[\"handler\"],\n"
              "    )\n"
              "    assert (\n"
              "        ToolCapability.PLUGIN_CODE\n"
              "        in registry.get_tool_capabilities(\"plugin_probe\")\n"
              "    )\n"
              "\n\n"
              "def test_web_extract_is_filesystem_backed_but_web_search_is_not():\n"
              "    import tools.web_tools  # noqa: F401\n"
              "    from tools.registry import registry\n"
              "\n"
              "    assert (\n"
              "        ToolCapability.FILESYSTEM_ACCESS\n"
              "        in registry.get_tool_capabilities(\"web_extract\")\n"
              "    )\n"
              "    assert (\n"
              "        ToolCapability.FILESYSTEM_ACCESS\n"
              "        not in registry.get_tool_capabilities(\"web_search\")\n"
              "    )\n"
          )
          test_path.write_text(text)
          PY

      - name: Remove one-shot workflow before validation commit
        run: rm .github/workflows/patch-mcp-codex-p1-round2.yml

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run focused MCP trust-boundary tests
        run: |
          uv run pytest -q \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py \
            tests/agent/transports/test_hermes_tools_mcp_context.py \
            tests/tools/test_mcp_tool.py

      - name: Ruff changed files
        run: |
          uv run ruff check \
            hermes_cli/plugins.py \
            tools/registry.py \
            agent/transports/hermes_tools_mcp_server.py \
            tools/web_tools.py \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(mcp): close remaining safe-mode trust gaps"
          git push origin HEAD:fix/mcp-trusted-side-effect-boundary
