name: Apply MCP Trusted Side-Effect Boundary

on:
  pull_request:
    branches:
      - fix/mcp-full-policy-hardening

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/mcp-trusted-side-effect-boundary
          fetch-depth: 0

      - name: Apply capability hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f"{label}: expected exactly one match, got {count}"
              return text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # Central capability taxonomy + pre-check filtering.
          # -----------------------------------------------------------------
          path = "tools/registry.py"
          text = read(path)
          text = replace_once(
              text,
              '    EXTERNAL_MCP = "external_mcp"\n',
              '    EXTERNAL_MCP = "external_mcp"\n    REMOTE_MUTATION = "remote_mutation"\n',
              "registry remote mutation capability",
          )
          text = replace_once(
              text,
              '    "cronjob": frozenset({ToolCapability.SPAWN_AGENT}),\n}',
              '''    "cronjob": frozenset({ToolCapability.SPAWN_AGENT}),
    "browser": frozenset(
        {
            ToolCapability.UI_AUTOMATION,
            ToolCapability.PROCESS_CONTROL,
            ToolCapability.FILESYSTEM_ACCESS,
        }
    ),
    "browser-cdp": frozenset(
        {ToolCapability.UI_AUTOMATION, ToolCapability.FILESYSTEM_ACCESS}
    ),
    "tts": frozenset(
        {
            ToolCapability.FILESYSTEM_ACCESS,
            ToolCapability.HOST_EXECUTION,
            ToolCapability.PROCESS_CONTROL,
        }
    ),
    "vision": frozenset({ToolCapability.FILESYSTEM_ACCESS}),
    "video": frozenset({ToolCapability.FILESYSTEM_ACCESS}),
    "image_gen": frozenset({ToolCapability.FILESYSTEM_ACCESS}),
}''',
              "registry toolset defaults",
          )
          text = replace_once(
              text,
              '    def get_definitions(self, tool_names: Set[str], quiet: bool = False) -> List[dict]:\n',
              '''    def get_definitions(
        self,
        tool_names: Set[str],
        quiet: bool = False,
        excluded_capabilities: Set[str] = None,
    ) -> List[dict]:
''',
              "registry get_definitions signature",
          )
          text = replace_once(
              text,
              '''        result = []
        # Per-call cache on top of the 30 s TTL — handles repeat probes of the
''',
              '''        result = []
        excluded = frozenset(excluded_capabilities or ())
        # Per-call cache on top of the 30 s TTL — handles repeat probes of the
''',
              "registry exclusion setup",
          )
          text = replace_once(
              text,
              '''            if not entry:
                continue
            if entry.check_fn:
''',
              '''            if not entry:
                continue
            # Security transports can reject a capability class before any
            # availability probe runs. Some check_fn implementations launch
            # subprocesses or probe host services, so post-filtering is too late.
            if excluded and entry.capabilities & excluded:
                if not quiet:
                    logger.debug(
                        "Tool %s excluded by capability policy before availability check",
                        name,
                    )
                continue
            if entry.check_fn:
''',
              "registry pre-check capability filter",
          )
          write(path, text)

          # -----------------------------------------------------------------
          # model_tools: safe MCP can suppress arbitrary plugin imports and
          # pass capability exclusions down before check_fn evaluation.
          # -----------------------------------------------------------------
          path = "model_tools.py"
          text = read(path)
          text = replace_once(
              text,
              '''# Plugin tool discovery (user/project/pip plugins)
try:
    from hermes_cli.plugins import discover_plugins
    discover_plugins()
except Exception as e:
    logger.debug("Plugin discovery failed: %s", e)
''',
              '''# Plugin tool discovery (user/project/pip plugins). Dedicated security
# transports can set HERMES_SKIP_PLUGIN_DISCOVERY before importing this module;
# plugin import is executable code and must not happen before their trust policy.
if not os.environ.get("HERMES_SKIP_PLUGIN_DISCOVERY"):
    try:
        from hermes_cli.plugins import discover_plugins
        discover_plugins()
    except Exception as e:
        logger.debug("Plugin discovery failed: %s", e)
else:
    logger.debug("Plugin discovery suppressed by HERMES_SKIP_PLUGIN_DISCOVERY")
''',
              "model_tools plugin discovery guard",
          )
          text = replace_once(
              text,
              '''    quiet_mode: bool = False,
    skip_tool_search_assembly: bool = False,
) -> List[Dict[str, Any]]:
''',
              '''    quiet_mode: bool = False,
    skip_tool_search_assembly: bool = False,
    excluded_capabilities: Optional[set[str]] = None,
) -> List[Dict[str, Any]]:
''',
              "get_tool_definitions signature",
          )
          text = replace_once(
              text,
              '''            bool(skip_tool_search_assembly),
            _is_delegated_child_context(),
''',
              '''            bool(skip_tool_search_assembly),
            frozenset(excluded_capabilities or ()),
            _is_delegated_child_context(),
''',
              "tool definition cache policy fingerprint",
          )
          text = replace_once(
              text,
              '''    result = _compute_tool_definitions(enabled_toolsets, disabled_toolsets, quiet_mode,
                                       skip_tool_search_assembly=skip_tool_search_assembly)
''',
              '''    result = _compute_tool_definitions(
        enabled_toolsets,
        disabled_toolsets,
        quiet_mode,
        skip_tool_search_assembly=skip_tool_search_assembly,
        excluded_capabilities=excluded_capabilities,
    )
''',
              "get_tool_definitions compute call",
          )
          # This exact signature occurs once for _compute after the public
          # signature above has already been replaced.
          text = replace_once(
              text,
              '''def _compute_tool_definitions(
    enabled_toolsets: Optional[List[str]] = None,
    disabled_toolsets: Optional[List[str]] = None,
    quiet_mode: bool = False,
    skip_tool_search_assembly: bool = False,
) -> List[Dict[str, Any]]:
''',
              '''def _compute_tool_definitions(
    enabled_toolsets: Optional[List[str]] = None,
    disabled_toolsets: Optional[List[str]] = None,
    quiet_mode: bool = False,
    skip_tool_search_assembly: bool = False,
    excluded_capabilities: Optional[set[str]] = None,
) -> List[Dict[str, Any]]:
''',
              "compute definitions signature",
          )
          text = replace_once(
              text,
              '    filtered_tools = registry.get_definitions(tools_to_include, quiet=quiet_mode)\n',
              '''    filtered_tools = registry.get_definitions(
        tools_to_include,
        quiet=quiet_mode,
        excluded_capabilities=excluded_capabilities,
    )
''',
              "registry definitions prefilter call",
          )
          write(path, text)

          # -----------------------------------------------------------------
          # MCP transport: resolve trust before importing model_tools; add
          # remote mutations to unsafe set; prefilter before availability probes.
          # -----------------------------------------------------------------
          path = "agent/transports/hermes_tools_mcp_server.py"
          text = read(path)
          text = replace_once(
              text,
              '        ToolCapability.EXTERNAL_MCP,\n',
              '        ToolCapability.EXTERNAL_MCP,\n        ToolCapability.REMOTE_MUTATION,\n',
              "MCP unsafe remote mutation",
          )
          text = replace_once(
              text,
              '''    from model_tools import get_tool_definitions, handle_function_call

    mcp_config = _load_hermes_tools_config()
    mode = _resolve_mcp_mode(config=mcp_config)
    discover_external = _resolve_discover_external(config=mcp_config)
    allow_native_execution = _resolve_allow_native_execution(config=mcp_config)
''',
              '''    mcp_config = _load_hermes_tools_config()
    mode = _resolve_mcp_mode(config=mcp_config)
    discover_external = _resolve_discover_external(config=mcp_config)
    allow_native_execution = _resolve_allow_native_execution(config=mcp_config)

    # Plugin import executes user/project/pip code. Resolve trust first and
    # suppress plugin discovery before importing model_tools unless this MCP
    # process has the explicit trusted execution opt-in.
    if not allow_native_execution:
        os.environ["HERMES_SKIP_PLUGIN_DISCOVERY"] = "1"

    from model_tools import get_tool_definitions, handle_function_call
''',
              "MCP resolve policy before model_tools import",
          )
          text = replace_once(
              text,
              '''            get_tool_definitions(
                quiet_mode=True,
                skip_tool_search_assembly=True,
            )
''',
              '''            get_tool_definitions(
                quiet_mode=True,
                skip_tool_search_assembly=True,
                excluded_capabilities=(
                    None if allow_native_execution else set(_MCP_UNSAFE_CAPABILITIES)
                ),
            )
''',
              "MCP prefilter unsafe definitions",
          )
          write(path, text)

          # -----------------------------------------------------------------
          # Explicit mixed-toolset metadata.
          # -----------------------------------------------------------------
          path = "tools/skill_manager_tool.py"
          text = read(path)
          text = replace_once(
              text,
              'from tools.registry import registry, tool_error\n\nregistry.register(\n    name="skill_manage",',
              'from tools.registry import ToolCapability, registry, tool_error\n\nregistry.register(\n    name="skill_manage",',
              "skill manager capability import",
          )
          text = replace_once(
              text,
              '''        absorbed_into=args.get("absorbed_into")),
    emoji="📝",
)''',
              '''        absorbed_into=args.get("absorbed_into")),
    capabilities={
        ToolCapability.FILESYSTEM_ACCESS,
        ToolCapability.HOST_EXECUTION,
    },
    emoji="📝",
)''',
              "skill_manage capabilities",
          )
          write(path, text)

          path = "tools/homeassistant_tool.py"
          text = read(path)
          text = replace_once(
              text,
              'from tools.registry import registry, tool_error\n',
              'from tools.registry import ToolCapability, registry, tool_error\n',
              "homeassistant capability import",
          )
          text = replace_once(
              text,
              '''    handler=_handle_call_service,
    check_fn=_check_ha_available,
    emoji="🏠",
)''',
              '''    handler=_handle_call_service,
    check_fn=_check_ha_available,
    capabilities={ToolCapability.REMOTE_MUTATION},
    emoji="🏠",
)''',
              "ha_call_service capability",
          )
          write(path, text)

          path = "tools/discord_tool.py"
          text = read(path)
          text = replace_once(
              text,
              'from tools.registry import registry\n',
              'from tools.registry import ToolCapability, registry\n',
              "discord capability import",
          )
          # Both multiplexed Discord tools include mutating actions.
          text = text.replace(
              '    requires_env=["DISCORD_BOT_TOKEN"],\n)',
              '    requires_env=["DISCORD_BOT_TOKEN"],\n    capabilities={ToolCapability.REMOTE_MUTATION},\n)',
          )
          assert text.count('capabilities={ToolCapability.REMOTE_MUTATION}') >= 2, "discord caps missing"
          write(path, text)

          path = "tools/feishu_drive_tool.py"
          text = read(path)
          text = replace_once(
              text,
              'from tools.registry import registry, tool_error, tool_result\n',
              'from tools.registry import ToolCapability, registry, tool_error, tool_result\n',
              "feishu capability import",
          )
          for tool_name in ("feishu_drive_reply_comment", "feishu_drive_add_comment"):
              pattern = rf'(registry\.register\(\n    name="{tool_name}",[\s\S]*?    is_async=False,\n)(    description=)'
              text, n = re.subn(
                  pattern,
                  r'\1    capabilities={ToolCapability.REMOTE_MUTATION},\n\2',
                  text,
                  count=1,
              )
              assert n == 1, f"feishu capability tag failed: {tool_name}"
          write(path, text)

          path = "tools/yuanbao_tools.py"
          text = read(path)
          text = replace_once(
              text,
              'from tools.registry import registry, tool_result  # noqa: E402\n',
              'from tools.registry import ToolCapability, registry, tool_result  # noqa: E402\n',
              "yuanbao capability import",
          )
          for tool_name, caps in (
              ("yb_send_dm", "{ToolCapability.REMOTE_MUTATION, ToolCapability.FILESYSTEM_ACCESS}"),
              ("yb_send_sticker", "{ToolCapability.REMOTE_MUTATION}"),
          ):
              pattern = rf'(registry\.register\(\n    name="{tool_name}",[\s\S]*?    check_fn=_check_yuanbao,\n)(    is_async=True,)'
              text, n = re.subn(
                  pattern,
                  rf'\1    capabilities={caps},\n\2',
                  text,
                  count=1,
              )
              assert n == 1, f"yuanbao capability tag failed: {tool_name}"
          write(path, text)

          path = "tools/kanban_tools.py"
          text = read(path)
          for tool_name, caps in (
              ("kanban_block", "{ToolCapability.SPAWN_WORKER}"),
              ("kanban_heartbeat", "{ToolCapability.SPAWN_WORKER, ToolCapability.PROCESS_CONTROL}"),
              ("kanban_comment", "{ToolCapability.SPAWN_WORKER}"),
              ("kanban_attach", "{ToolCapability.FILESYSTEM_ACCESS}"),
              ("kanban_attach_url", "{ToolCapability.FILESYSTEM_ACCESS}"),
              ("kanban_link", "{ToolCapability.SPAWN_WORKER}"),
          ):
              pattern = rf'(registry\.register\(\n    name="{tool_name}",[\s\S]*?    check_fn=[^\n]+,\n)(    emoji=)'
              text, n = re.subn(
                  pattern,
                  rf'\1    capabilities={caps},\n\2',
                  text,
                  count=1,
              )
              assert n == 1, f"kanban capability tag failed: {tool_name}"
          write(path, text)

          # -----------------------------------------------------------------
          # New focused invariants.
          # -----------------------------------------------------------------
          test = r'''from __future__ import annotations

from tools.registry import ToolCapability, ToolRegistry


def _register_dummy(registry: ToolRegistry, *, name: str, toolset: str, check_fn=None, capabilities=None):
    registry.register(
        name=name,
        toolset=toolset,
        schema={"name": name, "description": name, "parameters": {"type": "object", "properties": {}}},
        handler=lambda args, **kwargs: "ok",
        check_fn=check_fn,
        capabilities=capabilities,
    )


def test_unsafe_toolsets_inherit_trust_boundary_capabilities():
    registry = ToolRegistry()
    cases = {
        "browser": {ToolCapability.UI_AUTOMATION, ToolCapability.PROCESS_CONTROL, ToolCapability.FILESYSTEM_ACCESS},
        "browser-cdp": {ToolCapability.UI_AUTOMATION, ToolCapability.FILESYSTEM_ACCESS},
        "tts": {ToolCapability.FILESYSTEM_ACCESS, ToolCapability.HOST_EXECUTION, ToolCapability.PROCESS_CONTROL},
        "vision": {ToolCapability.FILESYSTEM_ACCESS},
        "video": {ToolCapability.FILESYSTEM_ACCESS},
        "image_gen": {ToolCapability.FILESYSTEM_ACCESS},
    }
    for index, (toolset, expected) in enumerate(cases.items()):
        name = f"dummy_{index}"
        _register_dummy(registry, name=name, toolset=toolset)
        assert expected <= set(registry.get_tool_capabilities(name))


def test_capability_exclusion_happens_before_availability_probe():
    registry = ToolRegistry()
    calls = []

    def dangerous_probe():
        calls.append("ran")
        return True

    _register_dummy(
        registry,
        name="dangerous_probe_tool",
        toolset="custom",
        check_fn=dangerous_probe,
        capabilities={ToolCapability.PROCESS_CONTROL},
    )
    definitions = registry.get_definitions(
        {"dangerous_probe_tool"},
        quiet=True,
        excluded_capabilities={ToolCapability.PROCESS_CONTROL},
    )
    assert definitions == []
    assert calls == []


def test_mixed_toolset_mutators_are_explicitly_classified():
    # Import only the modules whose registrations are under test; handlers are
    # lazy and do not perform remote calls at import time.
    import tools.discord_tool  # noqa: F401
    import tools.feishu_drive_tool  # noqa: F401
    import tools.homeassistant_tool  # noqa: F401
    import tools.kanban_tools  # noqa: F401
    import tools.skill_manager_tool  # noqa: F401
    import tools.yuanbao_tools  # noqa: F401
    from tools.registry import registry

    expected = {
        "skill_manage": {ToolCapability.FILESYSTEM_ACCESS, ToolCapability.HOST_EXECUTION},
        "ha_call_service": {ToolCapability.REMOTE_MUTATION},
        "discord": {ToolCapability.REMOTE_MUTATION},
        "discord_admin": {ToolCapability.REMOTE_MUTATION},
        "feishu_drive_reply_comment": {ToolCapability.REMOTE_MUTATION},
        "feishu_drive_add_comment": {ToolCapability.REMOTE_MUTATION},
        "yb_send_dm": {ToolCapability.REMOTE_MUTATION, ToolCapability.FILESYSTEM_ACCESS},
        "yb_send_sticker": {ToolCapability.REMOTE_MUTATION},
        "kanban_block": {ToolCapability.SPAWN_WORKER},
        "kanban_heartbeat": {ToolCapability.SPAWN_WORKER, ToolCapability.PROCESS_CONTROL},
        "kanban_comment": {ToolCapability.SPAWN_WORKER},
        "kanban_attach": {ToolCapability.FILESYSTEM_ACCESS},
        "kanban_attach_url": {ToolCapability.FILESYSTEM_ACCESS},
        "kanban_link": {ToolCapability.SPAWN_WORKER},
    }
    for name, required in expected.items():
        assert required <= set(registry.get_tool_capabilities(name)), name


def test_read_only_service_tools_are_not_blanket_classified_as_remote_mutations():
    import tools.feishu_drive_tool  # noqa: F401
    import tools.homeassistant_tool  # noqa: F401
    from tools.registry import registry

    for name in (
        "ha_list_entities",
        "ha_get_state",
        "ha_list_services",
        "feishu_drive_list_comments",
        "feishu_drive_list_comment_replies",
    ):
        assert ToolCapability.REMOTE_MUTATION not in registry.get_tool_capabilities(name), name
'''
          Path("tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py").write_text(test)
          PY

      - name: Remove one-shot workflow from resulting commit
        run: rm .github/workflows/apply-mcp-trusted-side-effect-boundary.yml

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Targeted trust-boundary tests
        run: |
          uv run pytest -q \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py \
            tests/agent/transports/test_hermes_tools_mcp_context.py \
            tests/tools/test_mcp_tool.py

      - name: Ruff changed files
        run: |
          uv run ruff check \
            agent/transports/hermes_tools_mcp_server.py \
            model_tools.py \
            tools/registry.py \
            tools/skill_manager_tool.py \
            tools/homeassistant_tool.py \
            tools/discord_tool.py \
            tools/feishu_drive_tool.py \
            tools/yuanbao_tools.py \
            tools/kanban_tools.py \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py

      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            agent/transports/hermes_tools_mcp_server.py \
            model_tools.py \
            tools/registry.py \
            tools/skill_manager_tool.py \
            tools/homeassistant_tool.py \
            tools/discord_tool.py \
            tools/feishu_drive_tool.py \
            tools/yuanbao_tools.py \
            tools/kanban_tools.py \
            tests/agent/transports/test_hermes_tools_mcp_trust_boundary.py
          git commit -m "fix(mcp): gate trusted side-effect capabilities"
          git push origin HEAD:fix/mcp-trusted-side-effect-boundary
