name: MCP Preexecution Patch Harness

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - fix/mcp-full-policy-hardening

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-validate:
    if: >-
      github.head_ref == 'fix/mcp-preexecution-boundary' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply exact-context source patch
        run: python scripts/_apply_mcp_preexecution_boundary.py

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run focused MCP and registry tests
        run: >-
          uv run pytest -q
          tests/agent/transports/test_mcp_preexecution_boundary.py
          tests/agent/transports/test_hermes_tools_mcp_policy.py
          tests/agent/transports/test_hermes_tools_mcp_server.py
          tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py
          tests/tools/test_registry.py

      - name: Ruff changed production and regression files
        run: >-
          uv run ruff check
          tools/registry.py
          model_tools.py
          agent/transports/hermes_tools_mcp_server.py
          tests/agent/transports/test_mcp_preexecution_boundary.py

      - name: Audit registered tool capability coverage
        env:
          HERMES_SKIP_PLUGIN_DISCOVERY: "1"
        run: |
          uv run python - <<'PY'
          import model_tools  # noqa: F401
          from tools.registry import registry
          for name in registry.get_all_tool_names():
              print(f"CAPABILITY_AUDIT {name}\t{registry.get_toolset_for_tool(name)}\t{','.join(sorted(registry.get_tool_capabilities(name)))}")
          PY

      - name: Remove one-shot harness and commit validated patch
        run: |
          git rm scripts/_apply_mcp_preexecution_boundary.py .github/workflows/_mcp_preexecution_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/registry.py model_tools.py agent/transports/hermes_tools_mcp_server.py tests/agent/transports/test_mcp_preexecution_boundary.py
          git commit -m "fix(mcp): enforce policy before discovery and probes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
