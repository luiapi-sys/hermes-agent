name: MCP Fail-Closed Capability Pass

on:
  pull_request:
    branches:
      - fix/mcp-full-policy-hardening

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/mcp-fail-closed-capabilities
          fetch-depth: 0

      - name: Apply fail-closed capability patch
        run: |
          if grep -q 'MCP_SAFE = "mcp_safe"' tools/registry.py; then
            echo "Patch already materialized"
          else
            python scripts/apply_mcp_fail_closed_capabilities.py
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Targeted MCP tests
        run: |
          uv run pytest -q \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py \
            tests/agent/transports/test_hermes_tools_mcp_context.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py \
            tests/tools/test_mcp_tool.py

      - name: Ruff security surface
        run: |
          uv run ruff check \
            tools/registry.py \
            model_tools.py \
            agent/transports/hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py

      - name: Commit materialized code changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/registry.py \
            model_tools.py \
            agent/transports/hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "fix(mcp): make safe-full capability policy fail closed"
            git push origin HEAD:fix/mcp-fail-closed-capabilities
          fi
