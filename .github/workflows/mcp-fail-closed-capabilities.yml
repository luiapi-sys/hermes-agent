name: MCP Fail-Closed Capability Pass

on:
  pull_request:
    branches:
      - fix/mcp-full-policy-hardening

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/mcp-fail-closed-capabilities
          fetch-depth: 0

      - name: Apply fail-closed capability patch
        run: |
          if grep -q 'MCP_SAFE = "mcp_safe"' tools/registry.py; then
            echo "Patch already materialized"
          else
            python scripts/apply_mcp_fail_closed_capabilities.py
          fi

      - name: Preserve trusted-mode compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "agent/transports/hermes_tools_mcp_server.py",
              '''    if allow_native_execution:\n        return tuple(name for name in EXPOSED_TOOLS if name in all_defs)\n''',
              '''    if allow_native_execution:\n        return EXPOSED_TOOLS\n''',
              "trusted curated compatibility",
          )

          replace_once(
              "agent/transports/hermes_tools_mcp_server.py",
              '''            get_tool_definitions(\n                quiet_mode=True,\n                skip_tool_search_assembly=True,\n                exclude_capabilities=(\n                    None if allow_native_execution else set(_MCP_UNSAFE_CAPABILITIES)\n                ),\n                require_capabilities=(\n                    {ToolCapability.MCP_SAFE}\n                    if mode == MCP_MODE_FULL and not allow_native_execution\n                    else None\n                ),\n            )\n''',
              '''            get_tool_definitions(\n                **(\n                    {\n                        "quiet_mode": True,\n                        "skip_tool_search_assembly": True,\n                    }\n                    if allow_native_execution\n                    else {\n                        "quiet_mode": True,\n                        "skip_tool_search_assembly": True,\n                        "exclude_capabilities": set(_MCP_UNSAFE_CAPABILITIES),\n                        **(\n                            {"require_capabilities": {ToolCapability.MCP_SAFE}}\n                            if mode == MCP_MODE_FULL\n                            else {}\n                        ),\n                    }\n                )\n            )\n''',
              "trusted get_tool_definitions kwargs",
          )

          replace_once(
              "tests/agent/transports/test_hermes_tools_mcp_policy.py",
              '        "memory": set(),\n',
              '        "memory": {ToolCapability.MCP_SAFE},\n',
              "memory explicit-safe expectation",
          )
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Targeted MCP tests
        run: |
          uv run pytest -q \
            tests/agent/transports/test_hermes_tools_mcp_policy.py \
            tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py \
            tests/agent/transports/test_hermes_tools_mcp_context.py \
            tests/agent/transports/test_hermes_tools_mcp_server.py \
            tests/tools/test_mcp_tool.py

      - name: Ruff security surface
        run: |
          uv run ruff check \
            tools/registry.py \
            model_tools.py \
            agent/transports/hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py

      - name: Commit materialized code changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/registry.py \
            model_tools.py \
            agent/transports/hermes_tools_mcp_server.py \
            tests/agent/transports/test_hermes_tools_mcp_policy.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "fix(mcp): make safe-full capability policy fail closed"
            git push origin HEAD:fix/mcp-fail-closed-capabilities
          fi
