name: MCP Capability Audit Closure

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - fix/mcp-full-policy-hardening

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-validate:
    if: >-
      github.head_ref == 'fix/mcp-preexecution-boundary' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply capability audit patch
        run: python scripts/_apply_mcp_capability_audit_fixes.py

      - name: Install dev dependencies
        run: uv sync --frozen --extra dev

      - name: Run focused policy and registry tests
        run: >-
          uv run pytest -q
          tests/agent/transports/test_mcp_preexecution_boundary.py
          tests/agent/transports/test_hermes_tools_mcp_policy.py
          tests/agent/transports/test_hermes_tools_mcp_server.py
          tests/agent/transports/test_hermes_tools_mcp_agent_loop_routing.py
          tests/tools/test_registry.py

      - name: Ruff policy files
        run: >-
          uv run ruff check
          tools/registry.py
          model_tools.py
          agent/transports/hermes_tools_mcp_server.py
          tests/agent/transports/test_mcp_preexecution_boundary.py

      - name: Assert audited unsafe toolsets are pre-probe excluded
        env:
          HERMES_SKIP_PLUGIN_DISCOVERY: "1"
        run: |
          uv run python - <<'PY'
          import model_tools  # noqa: F401
          from agent.transports.hermes_tools_mcp_server import _MCP_UNSAFE_CAPABILITIES
          from tools.registry import registry

          required = {
              "browser_cdp": "browser-cdp",
              "browser_dialog": "browser-cdp",
              "image_generate": "image_gen",
              "video_generate": "video_gen",
              "skills_list": "skills",
              "skill_view": "skills",
              "skill_manage": "skills",
              "project_list": "project",
              "project_create": "project",
              "project_switch": "project",
          }
          for name, expected_toolset in required.items():
              assert registry.get_toolset_for_tool(name) == expected_toolset, (name, registry.get_toolset_for_tool(name))
              caps = registry.get_tool_capabilities(name)
              assert caps & _MCP_UNSAFE_CAPABILITIES, (name, caps)
              print(f"MCP_AUDIT_UNSAFE_OK {name} {','.join(sorted(caps))}")
          PY

      - name: Remove one-shot harness and commit validated closure
        run: |
          git rm scripts/_apply_mcp_capability_audit_fixes.py .github/workflows/_mcp_capability_audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/registry.py tests/agent/transports/test_mcp_preexecution_boundary.py
          git commit -m "fix(mcp): close audited capability gaps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
